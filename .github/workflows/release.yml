name: Build and publish Director update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.4.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $version"
          }
          npm version $version --no-git-tag-version
          "DIRECTOR_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Typecheck and build
        run: npm run build

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always --config build/electron-builder.publish.yml

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Director-${{ env.DIRECTOR_RELEASE_VERSION }}-windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
